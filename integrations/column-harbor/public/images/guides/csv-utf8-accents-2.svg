<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="472" viewBox="0 0 1040 472" role="img" aria-labelledby="title desc"><title id="title">The same bytes, different decoding</title><desc id="desc">An incorrect legacy decoding may show MÃ¼nchen and JosÃ©, while UTF-8 displays München and José.</desc><rect width="1040" height="472" rx="14" fill="#f4f7fb"/><text x="40" y="48" font-family="Arial, sans-serif" font-size="32" fill="#142645"><tspan x="40" dy="0">The same bytes, different decoding</tspan></text><rect x="40" y="127" width="466" height="281" rx="10" fill="#ffffff" stroke="#d5dfec"/><rect x="40" y="127" width="466" height="5" rx="2" fill="#60708b"/><text x="62" y="163" font-family="Arial, sans-serif" font-size="14" fill="#60708b"><tspan x="62" dy="0">FIRST CASE</tspan></text><text x="62" y="201" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="62" dy="0">Incorrect legacy decoding</tspan></text><text x="62" y="266" font-family="Consolas, monospace" font-size="24" fill="#20334f"><tspan x="62" dy="0">MÃ¼nchen</tspan><tspan x="62" dy="34">JosÃ©</tspan><tspan x="62" dy="34">Accents display incorrectly</tspan></text><rect x="534" y="127" width="466" height="281" rx="10" fill="#eef3ff" stroke="#d5dfec"/><rect x="534" y="127" width="466" height="5" rx="2" fill="#234ddd"/><text x="556" y="163" font-family="Arial, sans-serif" font-size="14" fill="#234ddd"><tspan x="556" dy="0">SECOND CASE</tspan></text><text x="556" y="201" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="556" dy="0">Correct UTF-8 decoding</tspan></text><text x="556" y="266" font-family="Consolas, monospace" font-size="24" fill="#20334f"><tspan x="556" dy="0">München</tspan><tspan x="556" dy="34">José</tspan><tspan x="556" dy="34">Original characters</tspan><tspan x="556" dy="34">preserved</tspan></text><text x="40" y="450" font-family="Arial, sans-serif" font-size="13" fill="#536780"><tspan x="40" dy="0">COLUMN HARBOR  /  WORKED EXAMPLE</tspan></text></svg>