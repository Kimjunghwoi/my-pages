<svg xmlns="http://www.w3.org/2000/svg" width="480" height="706" viewBox="0 0 480 706" role="img" aria-labelledby="title desc"><title id="title">One boundary, no overlap</title><desc id="desc">January includes the 40, 60, and minus 10 Travel records. The 80 at exactly February 1 midnight belongs only to February.</desc><rect width="480" height="706" rx="14" fill="#f4f7fb"/><text x="26" y="48" font-family="Arial, sans-serif" font-size="27" fill="#142645"><tspan x="26" dy="0">One boundary, no overlap</tspan></text><rect x="26" y="120" width="428" height="250" rx="10" fill="#ffffff" stroke="#d5dfec"/><rect x="26" y="120" width="428" height="5" rx="2" fill="#60708b"/><text x="48" y="156" font-family="Arial, sans-serif" font-size="14" fill="#60708b"><tspan x="48" dy="0">FIRST CASE</tspan></text><text x="48" y="194" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="48" dy="0">January includes</tspan></text><text x="48" y="259" font-family="Consolas, monospace" font-size="23" fill="#20334f"><tspan x="48" dy="0">Jan 1 00:00:00 | 40</tspan><tspan x="48" dy="34">Jan 31 23:59:59 | 60</tspan><tspan x="48" dy="34">Jan 31 00:00:00 | -10</tspan></text><rect x="26" y="392" width="428" height="250" rx="10" fill="#eef3ff" stroke="#d5dfec"/><rect x="26" y="392" width="428" height="5" rx="2" fill="#234ddd"/><text x="48" y="428" font-family="Arial, sans-serif" font-size="14" fill="#234ddd"><tspan x="48" dy="0">SECOND CASE</tspan></text><text x="48" y="466" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="48" dy="0">February includes</tspan></text><text x="48" y="531" font-family="Consolas, monospace" font-size="23" fill="#20334f"><tspan x="48" dy="0">Feb 1 00:00:00 | 80</tspan><tspan x="48" dy="34">January Travel total: 90</tspan><tspan x="48" dy="34">February Travel total: 80</tspan></text><text x="26" y="684" font-family="Arial, sans-serif" font-size="13" fill="#536780"><tspan x="26" dy="0">COLUMN HARBOR  /  WORKED EXAMPLE</tspan></text></svg>