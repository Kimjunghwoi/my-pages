<svg xmlns="http://www.w3.org/2000/svg" width="480" height="741" viewBox="0 0 480 741" role="img" aria-labelledby="title desc"><title id="title">A comma inside a description</title><desc id="desc">A naive comma join splits Mug, blue into two fields, while quoting preserves three total fields.</desc><rect width="480" height="741" rx="14" fill="#f4f7fb"/><text x="26" y="48" font-family="Arial, sans-serif" font-size="27" fill="#142645"><tspan x="26" dy="0">A comma inside a</tspan><tspan x="26" dy="35">description</tspan></text><rect x="26" y="155" width="428" height="250" rx="10" fill="#ffffff" stroke="#d5dfec"/><rect x="26" y="155" width="428" height="5" rx="2" fill="#60708b"/><text x="48" y="191" font-family="Arial, sans-serif" font-size="14" fill="#60708b"><tspan x="48" dy="0">FIRST CASE</tspan></text><text x="48" y="229" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="48" dy="0">Naive join</tspan></text><text x="48" y="294" font-family="Consolas, monospace" font-size="23" fill="#20334f"><tspan x="48" dy="0">P11,Mug, blue,note</tspan><tspan x="48" dy="34">Four parsed fields</tspan></text><rect x="26" y="427" width="428" height="250" rx="10" fill="#eef3ff" stroke="#d5dfec"/><rect x="26" y="427" width="428" height="5" rx="2" fill="#234ddd"/><text x="48" y="463" font-family="Arial, sans-serif" font-size="14" fill="#234ddd"><tspan x="48" dy="0">SECOND CASE</tspan></text><text x="48" y="501" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="48" dy="0">CSV writer</tspan></text><text x="48" y="566" font-family="Consolas, monospace" font-size="23" fill="#20334f"><tspan x="48" dy="0">P11,&quot;Mug, blue&quot;,note</tspan><tspan x="48" dy="34">Three parsed fields</tspan></text><text x="26" y="719" font-family="Arial, sans-serif" font-size="13" fill="#536780"><tspan x="26" dy="0">COLUMN HARBOR  /  WORKED EXAMPLE</tspan></text></svg>