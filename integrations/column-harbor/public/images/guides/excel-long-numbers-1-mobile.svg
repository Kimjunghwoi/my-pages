<svg xmlns="http://www.w3.org/2000/svg" width="480" height="871" viewBox="0 0 480 871" role="img" aria-labelledby="title desc"><title id="title">Display change or changed identifier?</title><desc id="desc">A 15-digit value remains intact behind scientific notation, while a changed 16-digit identifier does not match its source after formatting.</desc><rect width="480" height="871" rx="14" fill="#f4f7fb"/><text x="26" y="48" font-family="Arial, sans-serif" font-size="27" fill="#142645"><tspan x="26" dy="0">Display change or changed</tspan><tspan x="26" dy="35">identifier?</tspan></text><rect x="26" y="155" width="428" height="315" rx="10" fill="#ffffff" stroke="#d5dfec"/><rect x="26" y="155" width="428" height="5" rx="2" fill="#60708b"/><text x="48" y="191" font-family="Arial, sans-serif" font-size="14" fill="#60708b"><tspan x="48" dy="0">FIRST CASE</tspan></text><text x="48" y="229" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="48" dy="0">Display-only control</tspan></text><text x="48" y="294" font-family="Consolas, monospace" font-size="23" fill="#20334f"><tspan x="48" dy="0">Source: 123456789012345</tspan><tspan x="48" dy="34">Visible: 1.23E+14</tspan><tspan x="48" dy="34">Number format:</tspan><tspan x="48" dy="34">123456789012345</tspan><tspan x="48" dy="34">Original still matches</tspan></text><rect x="26" y="492" width="428" height="315" rx="10" fill="#eef3ff" stroke="#d5dfec"/><rect x="26" y="492" width="428" height="5" rx="2" fill="#234ddd"/><text x="48" y="528" font-family="Arial, sans-serif" font-size="14" fill="#234ddd"><tspan x="48" dy="0">SECOND CASE</tspan></text><text x="48" y="566" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="48" dy="0">Already changed value</tspan></text><text x="48" y="631" font-family="Consolas, monospace" font-size="23" fill="#20334f"><tspan x="48" dy="0">Source: 1234567890123456</tspan><tspan x="48" dy="34">Stored: 1234567890123450</tspan><tspan x="48" dy="34">TEXT result: 12345678901234</tspan><tspan x="48" dy="34">50</tspan><tspan x="48" dy="34">Original does not match</tspan></text><text x="26" y="849" font-family="Arial, sans-serif" font-size="13" fill="#536780"><tspan x="26" dy="0">COLUMN HARBOR  /  WORKED EXAMPLE</tspan></text></svg>