<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="506" viewBox="0 0 1040 506" role="img" aria-labelledby="title desc"><title id="title">Different originals can collapse to one value</title><desc id="desc">Two 16-digit source IDs ending in 6 and 7 map to the same deliberately changed number ending in 0; both later TEXT results remain identical.</desc><rect width="1040" height="506" rx="14" fill="#f4f7fb"/><text x="40" y="48" font-family="Arial, sans-serif" font-size="32" fill="#142645"><tspan x="40" dy="0">Different originals can collapse to one value</tspan></text><rect x="40" y="127" width="466" height="315" rx="10" fill="#ffffff" stroke="#d5dfec"/><rect x="40" y="127" width="466" height="5" rx="2" fill="#60708b"/><text x="62" y="163" font-family="Arial, sans-serif" font-size="14" fill="#60708b"><tspan x="62" dy="0">FIRST CASE</tspan></text><text x="62" y="201" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="62" dy="0">Two independent source IDs</tspan></text><text x="62" y="266" font-family="Consolas, monospace" font-size="24" fill="#20334f"><tspan x="62" dy="0">1234567890123456</tspan><tspan x="62" dy="34">1234567890123457</tspan><tspan x="62" dy="34">Different final characters</tspan><tspan x="62" dy="34">Two distinct identifiers</tspan></text><rect x="534" y="127" width="466" height="315" rx="10" fill="#eef3ff" stroke="#d5dfec"/><rect x="534" y="127" width="466" height="5" rx="2" fill="#234ddd"/><text x="556" y="163" font-family="Arial, sans-serif" font-size="14" fill="#234ddd"><tspan x="556" dy="0">SECOND CASE</tspan></text><text x="556" y="201" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="556" dy="0">Known changed numeric results</tspan></text><text x="556" y="266" font-family="Consolas, monospace" font-size="24" fill="#20334f"><tspan x="556" dy="0">1234567890123450</tspan><tspan x="556" dy="34">1234567890123450</tspan><tspan x="556" dy="34">TEXT keeps these same digits</tspan><tspan x="556" dy="34">Length 16 does not prove</tspan><tspan x="556" dy="34">identity</tspan></text><text x="40" y="484" font-family="Arial, sans-serif" font-size="13" fill="#536780"><tspan x="40" dy="0">COLUMN HARBOR  /  WORKED EXAMPLE</tspan></text></svg>