<svg xmlns="http://www.w3.org/2000/svg" width="480" height="997" viewBox="0 0 480 997" role="img" aria-labelledby="title desc"><title id="title">Different originals can collapse to one value</title><desc id="desc">Two 16-digit source IDs ending in 6 and 7 map to the same deliberately changed number ending in 0; both later TEXT results remain identical.</desc><rect width="480" height="997" rx="14" fill="#f4f7fb"/><text x="26" y="48" font-family="Arial, sans-serif" font-size="27" fill="#142645"><tspan x="26" dy="0">Different originals can</tspan><tspan x="26" dy="35">collapse to one value</tspan></text><rect x="26" y="155" width="428" height="378" rx="10" fill="#ffffff" stroke="#d5dfec"/><rect x="26" y="155" width="428" height="5" rx="2" fill="#60708b"/><text x="48" y="191" font-family="Arial, sans-serif" font-size="14" fill="#60708b"><tspan x="48" dy="0">FIRST CASE</tspan></text><text x="48" y="229" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="48" dy="0">Two independent source IDs</tspan></text><text x="48" y="294" font-family="Consolas, monospace" font-size="23" fill="#20334f"><tspan x="48" dy="0">1234567890123456</tspan><tspan x="48" dy="34">1234567890123457</tspan><tspan x="48" dy="34">Different final characters</tspan><tspan x="48" dy="34">Two distinct identifiers</tspan></text><rect x="26" y="555" width="428" height="378" rx="10" fill="#eef3ff" stroke="#d5dfec"/><rect x="26" y="555" width="428" height="5" rx="2" fill="#234ddd"/><text x="48" y="591" font-family="Arial, sans-serif" font-size="14" fill="#234ddd"><tspan x="48" dy="0">SECOND CASE</tspan></text><text x="48" y="629" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="48" dy="0">Known changed numeric</tspan><tspan x="48" dy="29">results</tspan></text><text x="48" y="723" font-family="Consolas, monospace" font-size="23" fill="#20334f"><tspan x="48" dy="0">1234567890123450</tspan><tspan x="48" dy="34">1234567890123450</tspan><tspan x="48" dy="34">TEXT keeps these same</tspan><tspan x="48" dy="34">digits</tspan><tspan x="48" dy="34">Length 16 does not prove</tspan><tspan x="48" dy="34">identity</tspan></text><text x="26" y="975" font-family="Arial, sans-serif" font-size="13" fill="#536780"><tspan x="26" dy="0">COLUMN HARBOR  /  WORKED EXAMPLE</tspan></text></svg>