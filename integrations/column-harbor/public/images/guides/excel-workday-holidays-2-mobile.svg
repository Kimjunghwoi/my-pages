<svg xmlns="http://www.w3.org/2000/svg" width="480" height="741" viewBox="0 0 480 741" role="img" aria-labelledby="title desc"><title id="title">Three workdays after September 4</title><desc id="desc">The third eligible working date after September 4 is September 11 because two closures and the weekend are excluded.</desc><rect width="480" height="741" rx="14" fill="#f4f7fb"/><text x="26" y="48" font-family="Arial, sans-serif" font-size="27" fill="#142645"><tspan x="26" dy="0">Three workdays after</tspan><tspan x="26" dy="35">September 4</tspan></text><rect x="26" y="155" width="428" height="250" rx="10" fill="#ffffff" stroke="#d5dfec"/><rect x="26" y="155" width="428" height="5" rx="2" fill="#60708b"/><text x="48" y="191" font-family="Arial, sans-serif" font-size="14" fill="#60708b"><tspan x="48" dy="0">FIRST CASE</tspan></text><text x="48" y="229" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="48" dy="0">Skip these dates</tspan></text><text x="48" y="294" font-family="Consolas, monospace" font-size="23" fill="#20334f"><tspan x="48" dy="0">Sep 5–6: weekend</tspan><tspan x="48" dy="34">Sep 7: closure</tspan><tspan x="48" dy="34">Sep 10: closure</tspan></text><rect x="26" y="427" width="428" height="250" rx="10" fill="#eef3ff" stroke="#d5dfec"/><rect x="26" y="427" width="428" height="5" rx="2" fill="#234ddd"/><text x="48" y="463" font-family="Arial, sans-serif" font-size="14" fill="#234ddd"><tspan x="48" dy="0">SECOND CASE</tspan></text><text x="48" y="501" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="48" dy="0">Count these dates</tspan></text><text x="48" y="566" font-family="Consolas, monospace" font-size="23" fill="#20334f"><tspan x="48" dy="0">Sep 8: day 1</tspan><tspan x="48" dy="34">Sep 9: day 2</tspan><tspan x="48" dy="34">Sep 11: day 3</tspan></text><text x="26" y="719" font-family="Arial, sans-serif" font-size="13" fill="#536780"><tspan x="26" dy="0">COLUMN HARBOR  /  WORKED EXAMPLE</tspan></text></svg>