<svg xmlns="http://www.w3.org/2000/svg" width="480" height="776" viewBox="0 0 480 776" role="img" aria-labelledby="title desc"><title id="title">A visible expression is not enough to identify the cause</title><desc id="desc">A visible expression is not enough to identify the cause: Many formulas visible; One literal =B2*C2 → Check Show Formulas; Check format and re-entry</desc><rect width="480" height="776" rx="14" fill="#f4f7fb"/><text x="26" y="48" font-family="Arial, sans-serif" font-size="27" fill="#142645"><tspan x="26" dy="0">A visible expression is not</tspan><tspan x="26" dy="35">enough to identify the</tspan><tspan x="26" dy="35">cause</tspan></text><rect x="26" y="190" width="428" height="250" rx="10" fill="#ffffff" stroke="#d5dfec"/><rect x="26" y="190" width="428" height="5" rx="2" fill="#60708b"/><text x="48" y="226" font-family="Arial, sans-serif" font-size="14" fill="#60708b"><tspan x="48" dy="0">FIRST CASE</tspan></text><text x="48" y="264" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="48" dy="0">Before / input</tspan></text><text x="48" y="329" font-family="Consolas, monospace" font-size="23" fill="#20334f"><tspan x="48" dy="0">Many formulas visible</tspan><tspan x="48" dy="34">One literal =B2*C2</tspan></text><rect x="26" y="462" width="428" height="250" rx="10" fill="#eef3ff" stroke="#d5dfec"/><rect x="26" y="462" width="428" height="5" rx="2" fill="#234ddd"/><text x="48" y="498" font-family="Arial, sans-serif" font-size="14" fill="#234ddd"><tspan x="48" dy="0">SECOND CASE</tspan></text><text x="48" y="536" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="48" dy="0">After / check</tspan></text><text x="48" y="601" font-family="Consolas, monospace" font-size="23" fill="#20334f"><tspan x="48" dy="0">Check Show Formulas</tspan><tspan x="48" dy="34">Check format and re-entry</tspan></text><text x="26" y="754" font-family="Arial, sans-serif" font-size="13" fill="#536780"><tspan x="26" dy="0">COLUMN HARBOR  /  WORKED EXAMPLE</tspan></text></svg>