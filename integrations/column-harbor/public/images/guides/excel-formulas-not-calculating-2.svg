<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="483" viewBox="0 0 1040 483" role="img" aria-labelledby="title desc"><title id="title">A visible expression is not enough to identify the cause</title><desc id="desc">A visible expression is not enough to identify the cause: Many formulas visible; One literal =B2*C2 → Check Show Formulas; Check format and re-entry</desc><rect width="1040" height="483" rx="14" fill="#f4f7fb"/><text x="40" y="48" font-family="Arial, sans-serif" font-size="32" fill="#142645"><tspan x="40" dy="0">A visible expression is not enough to identify the</tspan><tspan x="40" dy="42">cause</tspan></text><rect x="40" y="169" width="466" height="250" rx="10" fill="#ffffff" stroke="#d5dfec"/><rect x="40" y="169" width="466" height="5" rx="2" fill="#60708b"/><text x="62" y="205" font-family="Arial, sans-serif" font-size="14" fill="#60708b"><tspan x="62" dy="0">FIRST CASE</tspan></text><text x="62" y="243" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="62" dy="0">Before / input</tspan></text><text x="62" y="308" font-family="Consolas, monospace" font-size="24" fill="#20334f"><tspan x="62" dy="0">Many formulas visible</tspan><tspan x="62" dy="34">One literal =B2*C2</tspan></text><rect x="534" y="169" width="466" height="250" rx="10" fill="#eef3ff" stroke="#d5dfec"/><rect x="534" y="169" width="466" height="5" rx="2" fill="#234ddd"/><text x="556" y="205" font-family="Arial, sans-serif" font-size="14" fill="#234ddd"><tspan x="556" dy="0">SECOND CASE</tspan></text><text x="556" y="243" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="556" dy="0">After / check</tspan></text><text x="556" y="308" font-family="Consolas, monospace" font-size="24" fill="#20334f"><tspan x="556" dy="0">Check Show Formulas</tspan><tspan x="556" dy="34">Check format and re-entry</tspan></text><text x="40" y="461" font-family="Arial, sans-serif" font-size="13" fill="#536780"><tspan x="40" dy="0">COLUMN HARBOR  /  WORKED EXAMPLE</tspan></text></svg>