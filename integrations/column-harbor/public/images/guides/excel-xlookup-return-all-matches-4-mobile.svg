<svg xmlns="http://www.w3.org/2000/svg" width="480" height="803" viewBox="0 0 480 803" role="img" aria-labelledby="title desc"><title id="title">Keep transactions, then apply the status rule</title><desc id="desc">The status condition removes the closed order and preserves all three open orders, including two separate amounts of twenty.</desc><rect width="480" height="803" rx="14" fill="#f4f7fb"/><text x="26" y="48" font-family="Arial, sans-serif" font-size="27" fill="#142645"><tspan x="26" dy="0">Keep transactions, then</tspan><tspan x="26" dy="35">apply the status rule</tspan></text><rect x="26" y="155" width="428" height="281" rx="10" fill="#ffffff" stroke="#d5dfec"/><rect x="26" y="155" width="428" height="5" rx="2" fill="#60708b"/><text x="48" y="191" font-family="Arial, sans-serif" font-size="14" fill="#60708b"><tspan x="48" dy="0">FIRST CASE</tspan></text><text x="48" y="229" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="48" dy="0">All C-7 orders</tspan></text><text x="48" y="294" font-family="Consolas, monospace" font-size="23" fill="#20334f"><tspan x="48" dy="0">O-101: Open, 20</tspan><tspan x="48" dy="34">O-103: Closed, 15</tspan><tspan x="48" dy="34">O-104: Open, 25; O-106:</tspan><tspan x="48" dy="34">Open, 20</tspan></text><rect x="26" y="458" width="428" height="281" rx="10" fill="#eef3ff" stroke="#d5dfec"/><rect x="26" y="458" width="428" height="5" rx="2" fill="#234ddd"/><text x="48" y="494" font-family="Arial, sans-serif" font-size="14" fill="#234ddd"><tspan x="48" dy="0">SECOND CASE</tspan></text><text x="48" y="532" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="48" dy="0">Open C-7 orders</tspan></text><text x="48" y="597" font-family="Consolas, monospace" font-size="23" fill="#20334f"><tspan x="48" dy="0">O-101: 20</tspan><tspan x="48" dy="34">O-104: 25</tspan><tspan x="48" dy="34">O-106: 20; total 65</tspan></text><text x="26" y="781" font-family="Arial, sans-serif" font-size="13" fill="#536780"><tspan x="26" dy="0">COLUMN HARBOR  /  WORKED EXAMPLE</tspan></text></svg>