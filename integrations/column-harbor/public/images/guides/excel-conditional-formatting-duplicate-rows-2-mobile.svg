<svg xmlns="http://www.w3.org/2000/svg" width="480" height="776" viewBox="0 0 480 776" role="img" aria-labelledby="title desc"><title id="title">Repeated values are not necessarily repeated records</title><desc id="desc">A shared order or product alone is insufficient; only the two repeated combinations receive the fill.</desc><rect width="480" height="776" rx="14" fill="#f4f7fb"/><text x="26" y="48" font-family="Arial, sans-serif" font-size="27" fill="#142645"><tspan x="26" dy="0">Repeated values are not</tspan><tspan x="26" dy="35">necessarily repeated</tspan><tspan x="26" dy="35">records</tspan></text><rect x="26" y="190" width="428" height="250" rx="10" fill="#ffffff" stroke="#d5dfec"/><rect x="26" y="190" width="428" height="5" rx="2" fill="#60708b"/><text x="48" y="226" font-family="Arial, sans-serif" font-size="14" fill="#60708b"><tspan x="48" dy="0">FIRST CASE</tspan></text><text x="48" y="264" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="48" dy="0">Different pairs</tspan></text><text x="48" y="329" font-family="Consolas, monospace" font-size="23" fill="#20334f"><tspan x="48" dy="0">O-01 / P-B</tspan><tspan x="48" dy="34">O-02 / P-A</tspan><tspan x="48" dy="34">Each appears once</tspan></text><rect x="26" y="462" width="428" height="250" rx="10" fill="#eef3ff" stroke="#d5dfec"/><rect x="26" y="462" width="428" height="5" rx="2" fill="#234ddd"/><text x="48" y="498" font-family="Arial, sans-serif" font-size="14" fill="#234ddd"><tspan x="48" dy="0">SECOND CASE</tspan></text><text x="48" y="536" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="48" dy="0">Repeated pairs</tspan></text><text x="48" y="601" font-family="Consolas, monospace" font-size="23" fill="#20334f"><tspan x="48" dy="0">O-01 / P-A: rows 2 and 4</tspan><tspan x="48" dy="34">O-03 / P-C: rows 6 and 7</tspan><tspan x="48" dy="34">Highlight both occurrences</tspan></text><text x="26" y="754" font-family="Arial, sans-serif" font-size="13" fill="#536780"><tspan x="26" dy="0">COLUMN HARBOR  /  WORKED EXAMPLE</tspan></text></svg>