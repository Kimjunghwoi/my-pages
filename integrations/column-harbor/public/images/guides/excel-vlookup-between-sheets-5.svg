<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="441" viewBox="0 0 1040 441" role="img" aria-labelledby="title desc"><title id="title">The same display can mean different things</title><desc id="desc">A real zero and an empty return cell both appear as zero in a direct VLOOKUP result.</desc><rect width="1040" height="441" rx="14" fill="#f4f7fb"/><text x="40" y="48" font-family="Arial, sans-serif" font-size="32" fill="#142645"><tspan x="40" dy="0">The same display can mean different things</tspan></text><rect x="40" y="127" width="466" height="250" rx="10" fill="#ffffff" stroke="#d5dfec"/><rect x="40" y="127" width="466" height="5" rx="2" fill="#60708b"/><text x="62" y="163" font-family="Arial, sans-serif" font-size="14" fill="#60708b"><tspan x="62" dy="0">FIRST CASE</tspan></text><text x="62" y="201" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="62" dy="0">Source records</tspan></text><text x="62" y="266" font-family="Consolas, monospace" font-size="24" fill="#20334f"><tspan x="62" dy="0">P102: recorded 0</tspan><tspan x="62" dy="34">P104: empty price</tspan></text><rect x="534" y="127" width="466" height="250" rx="10" fill="#eef3ff" stroke="#d5dfec"/><rect x="534" y="127" width="466" height="5" rx="2" fill="#234ddd"/><text x="556" y="163" font-family="Arial, sans-serif" font-size="14" fill="#234ddd"><tspan x="556" dy="0">SECOND CASE</tspan></text><text x="556" y="201" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="556" dy="0">Lookup display</tspan></text><text x="556" y="266" font-family="Consolas, monospace" font-size="24" fill="#20334f"><tspan x="556" dy="0">P102 → 0</tspan><tspan x="556" dy="34">P104 → 0</tspan></text><text x="40" y="419" font-family="Arial, sans-serif" font-size="13" fill="#536780"><tspan x="40" dy="0">COLUMN HARBOR  /  WORKED EXAMPLE</tspan></text></svg>