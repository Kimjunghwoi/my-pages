<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="441" viewBox="0 0 1040 441" role="img" aria-labelledby="title desc"><title id="title">Two modes answer different review questions</title><desc id="desc">Two modes answer different review questions: Every occurrence: rows 2,3,4,7; Later only: rows 4,7 → 6 records retained; Total remains 78</desc><rect width="1040" height="441" rx="14" fill="#f4f7fb"/><text x="40" y="48" font-family="Arial, sans-serif" font-size="32" fill="#142645"><tspan x="40" dy="0">Two modes answer different review questions</tspan></text><rect x="40" y="127" width="466" height="250" rx="10" fill="#ffffff" stroke="#d5dfec"/><rect x="40" y="127" width="466" height="5" rx="2" fill="#60708b"/><text x="62" y="163" font-family="Arial, sans-serif" font-size="14" fill="#60708b"><tspan x="62" dy="0">FIRST CASE</tspan></text><text x="62" y="201" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="62" dy="0">Input / configuration</tspan></text><text x="62" y="266" font-family="Consolas, monospace" font-size="24" fill="#20334f"><tspan x="62" dy="0">Every occurrence: rows</tspan><tspan x="62" dy="34">2,3,4,7</tspan><tspan x="62" dy="34">Later only: rows 4,7</tspan></text><rect x="534" y="127" width="466" height="250" rx="10" fill="#eef3ff" stroke="#d5dfec"/><rect x="534" y="127" width="466" height="5" rx="2" fill="#234ddd"/><text x="556" y="163" font-family="Arial, sans-serif" font-size="14" fill="#234ddd"><tspan x="556" dy="0">SECOND CASE</tspan></text><text x="556" y="201" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="556" dy="0">Expected / verification</tspan></text><text x="556" y="266" font-family="Consolas, monospace" font-size="24" fill="#20334f"><tspan x="556" dy="0">6 records retained</tspan><tspan x="556" dy="34">Total remains 78</tspan></text><text x="40" y="419" font-family="Arial, sans-serif" font-size="13" fill="#536780"><tspan x="40" dy="0">COLUMN HARBOR  /  WORKED EXAMPLE</tspan></text></svg>