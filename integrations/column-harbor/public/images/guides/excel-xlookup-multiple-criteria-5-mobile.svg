<svg xmlns="http://www.w3.org/2000/svg" width="480" height="768" viewBox="0 0 480 768" role="img" aria-labelledby="title desc"><title id="title">Choose the result shape</title><desc id="desc">A guarded scalar lookup flags duplicates while FILTER lists both qualifying rows.</desc><rect width="480" height="768" rx="14" fill="#f4f7fb"/><text x="26" y="48" font-family="Arial, sans-serif" font-size="27" fill="#142645"><tspan x="26" dy="0">Choose the result shape</tspan></text><rect x="26" y="120" width="428" height="281" rx="10" fill="#ffffff" stroke="#d5dfec"/><rect x="26" y="120" width="428" height="5" rx="2" fill="#60708b"/><text x="48" y="156" font-family="Arial, sans-serif" font-size="14" fill="#60708b"><tspan x="48" dy="0">FIRST CASE</tspan></text><text x="48" y="194" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="48" dy="0">One requested value</tspan></text><text x="48" y="259" font-family="Consolas, monospace" font-size="23" fill="#20334f"><tspan x="48" dy="0">East + P101</tspan><tspan x="48" dy="34">Two matching rates</tspan></text><rect x="26" y="423" width="428" height="281" rx="10" fill="#eef3ff" stroke="#d5dfec"/><rect x="26" y="423" width="428" height="5" rx="2" fill="#234ddd"/><text x="48" y="459" font-family="Arial, sans-serif" font-size="14" fill="#234ddd"><tspan x="48" dy="0">SECOND CASE</tspan></text><text x="48" y="497" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="48" dy="0">Explicit outcomes</tspan></text><text x="48" y="562" font-family="Consolas, monospace" font-size="23" fill="#20334f"><tspan x="48" dy="0">Guarded lookup: Multiple</tspan><tspan x="48" dy="34">matches</tspan><tspan x="48" dy="34">Detail report: rows for 12</tspan><tspan x="48" dy="34">and 15</tspan></text><text x="26" y="746" font-family="Arial, sans-serif" font-size="13" fill="#536780"><tspan x="26" dy="0">COLUMN HARBOR  /  WORKED EXAMPLE</tspan></text></svg>