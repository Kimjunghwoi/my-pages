<svg xmlns="http://www.w3.org/2000/svg" width="480" height="803" viewBox="0 0 480 803" role="img" aria-labelledby="title desc"><title id="title">Remove the report wrapper before promotion</title><desc id="desc">Illustrative row accounting: two preamble rows are removed and the third row becomes column names, leaving three records.</desc><rect width="480" height="803" rx="14" fill="#f4f7fb"/><text x="26" y="48" font-family="Arial, sans-serif" font-size="27" fill="#142645"><tspan x="26" dy="0">Remove the report wrapper</tspan><tspan x="26" dy="35">before promotion</tspan></text><rect x="26" y="155" width="428" height="281" rx="10" fill="#ffffff" stroke="#d5dfec"/><rect x="26" y="155" width="428" height="5" rx="2" fill="#60708b"/><text x="48" y="191" font-family="Arial, sans-serif" font-size="14" fill="#60708b"><tspan x="48" dy="0">FIRST CASE</tspan></text><text x="48" y="229" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="48" dy="0">Six source records</tspan></text><text x="48" y="294" font-family="Consolas, monospace" font-size="23" fill="#20334f"><tspan x="48" dy="0">1 report title</tspan><tspan x="48" dy="34">2 prepared date</tspan><tspan x="48" dy="34">3 item_id,region,quantity</tspan><tspan x="48" dy="34">4-6 inventory records</tspan></text><rect x="26" y="458" width="428" height="281" rx="10" fill="#eef3ff" stroke="#d5dfec"/><rect x="26" y="458" width="428" height="5" rx="2" fill="#234ddd"/><text x="48" y="494" font-family="Arial, sans-serif" font-size="14" fill="#234ddd"><tspan x="48" dy="0">SECOND CASE</tspan></text><text x="48" y="532" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="48" dy="0">Four table records</tspan></text><text x="48" y="597" font-family="Consolas, monospace" font-size="23" fill="#20334f"><tspan x="48" dy="0">item_id, region, quantity</tspan><tspan x="48" dy="34">0007 | North | 4</tspan><tspan x="48" dy="34">0012 | South | 0</tspan><tspan x="48" dy="34">0012 | East | 6</tspan></text><text x="26" y="781" font-family="Arial, sans-serif" font-size="13" fill="#536780"><tspan x="26" dy="0">COLUMN HARBOR  /  WORKED EXAMPLE</tspan></text></svg>