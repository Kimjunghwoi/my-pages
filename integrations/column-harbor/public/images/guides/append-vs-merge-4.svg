<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="472" viewBox="0 0 1040 472" role="img" aria-labelledby="title desc"><title id="title">A duplicate lookup key multiplies orders</title><desc id="desc">SKU matches: 00123: two products; 00456: one product. Expanded order rows: A01: 2 rows; A02: 1 row; B01: 2 rows; Total: 5. Synthetic calculation: duplicate lookup keys change the grain of the result.</desc><rect width="1040" height="472" rx="14" fill="#f4f7fb"/><text x="40" y="48" font-family="Arial, sans-serif" font-size="32" fill="#142645"><tspan x="40" dy="0">A duplicate lookup key multiplies orders</tspan></text><rect x="40" y="127" width="466" height="281" rx="10" fill="#ffffff" stroke="#d5dfec"/><rect x="40" y="127" width="466" height="5" rx="2" fill="#60708b"/><text x="62" y="163" font-family="Arial, sans-serif" font-size="14" fill="#60708b"><tspan x="62" dy="0">FIRST CASE</tspan></text><text x="62" y="201" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="62" dy="0">SKU matches</tspan></text><text x="62" y="266" font-family="Consolas, monospace" font-size="24" fill="#20334f"><tspan x="62" dy="0">00123: two products</tspan><tspan x="62" dy="34">00456: one product</tspan></text><rect x="534" y="127" width="466" height="281" rx="10" fill="#eef3ff" stroke="#d5dfec"/><rect x="534" y="127" width="466" height="5" rx="2" fill="#234ddd"/><text x="556" y="163" font-family="Arial, sans-serif" font-size="14" fill="#234ddd"><tspan x="556" dy="0">SECOND CASE</tspan></text><text x="556" y="201" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="556" dy="0">Expanded order rows</tspan></text><text x="556" y="266" font-family="Consolas, monospace" font-size="24" fill="#20334f"><tspan x="556" dy="0">A01: 2 rows</tspan><tspan x="556" dy="34">A02: 1 row</tspan><tspan x="556" dy="34">B01: 2 rows</tspan><tspan x="556" dy="34">Total: 5</tspan></text><text x="40" y="450" font-family="Arial, sans-serif" font-size="13" fill="#536780"><tspan x="40" dy="0">COLUMN HARBOR  /  WORKED EXAMPLE</tspan></text></svg>