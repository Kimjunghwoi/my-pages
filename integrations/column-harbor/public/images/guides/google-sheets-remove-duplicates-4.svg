<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="472" viewBox="0 0 1040 472" role="img" aria-labelledby="title desc"><title id="title">Full-row result for the sample</title><desc id="desc">Five source records become four distinct rows while retaining the E01 record for each of two cities.</desc><rect width="1040" height="472" rx="14" fill="#f4f7fb"/><text x="40" y="48" font-family="Arial, sans-serif" font-size="32" fill="#142645"><tspan x="40" dy="0">Full-row result for the sample</tspan></text><rect x="40" y="127" width="466" height="281" rx="10" fill="#ffffff" stroke="#d5dfec"/><rect x="40" y="127" width="466" height="5" rx="2" fill="#60708b"/><text x="62" y="163" font-family="Arial, sans-serif" font-size="14" fill="#60708b"><tspan x="62" dy="0">FIRST CASE</tspan></text><text x="62" y="201" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="62" dy="0">Five source records</tspan></text><text x="62" y="266" font-family="Consolas, monospace" font-size="24" fill="#20334f"><tspan x="62" dy="0">E01 | Ada | Seoul (twice)</tspan><tspan x="62" dy="34">E02 | Ben | Busan</tspan><tspan x="62" dy="34">E01 | Ada | Busan</tspan><tspan x="62" dy="34">E03 | Cara | Daegu</tspan></text><rect x="534" y="127" width="466" height="281" rx="10" fill="#eef3ff" stroke="#d5dfec"/><rect x="534" y="127" width="466" height="5" rx="2" fill="#234ddd"/><text x="556" y="163" font-family="Arial, sans-serif" font-size="14" fill="#234ddd"><tspan x="556" dy="0">SECOND CASE</tspan></text><text x="556" y="201" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="556" dy="0">Four retained records</tspan></text><text x="556" y="266" font-family="Consolas, monospace" font-size="24" fill="#20334f"><tspan x="556" dy="0">E01 | Ada | Seoul</tspan><tspan x="556" dy="34">E02 | Ben | Busan</tspan><tspan x="556" dy="34">E01 | Ada | Busan</tspan><tspan x="556" dy="34">E03 | Cara | Daegu</tspan></text><text x="40" y="450" font-family="Arial, sans-serif" font-size="13" fill="#536780"><tspan x="40" dy="0">COLUMN HARBOR  /  WORKED EXAMPLE</tspan></text></svg>