<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="467" viewBox="0 0 1040 467" role="img" aria-labelledby="title desc"><title id="title">Direction changes the question</title><desc id="desc">Illustrative exact-key comparison: left anti preserves unmatched left records; reversing the inputs answers a different question.</desc><rect width="1040" height="467" rx="14" fill="#f4f7fb"/><text x="40" y="48" font-family="Arial, sans-serif" font-size="32" fill="#142645"><tspan x="40" dy="0">Direction changes the question</tspan></text><rect x="40" y="127" width="466" height="276" rx="10" fill="#ffffff" stroke="#d5dfec"/><rect x="40" y="127" width="466" height="5" rx="2" fill="#60708b"/><text x="62" y="163" font-family="Arial, sans-serif" font-size="14" fill="#60708b"><tspan x="62" dy="0">FIRST CASE</tspan></text><text x="62" y="201" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="62" dy="0">Requests compared to</tspan><tspan x="62" dy="29">availability</tspan></text><text x="62" y="295" font-family="Consolas, monospace" font-size="24" fill="#20334f"><tspan x="62" dy="0">A200 lines L2 and L3 missing</tspan><tspan x="62" dy="34">Leading-space A100 line L6</tspan><tspan x="62" dy="34">missing</tspan></text><rect x="534" y="127" width="466" height="276" rx="10" fill="#eef3ff" stroke="#d5dfec"/><rect x="534" y="127" width="466" height="5" rx="2" fill="#234ddd"/><text x="556" y="163" font-family="Arial, sans-serif" font-size="14" fill="#234ddd"><tspan x="556" dy="0">SECOND CASE</tspan></text><text x="556" y="201" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="556" dy="0">Availability compared to</tspan><tspan x="556" dy="29">requests</tspan></text><text x="556" y="295" font-family="Consolas, monospace" font-size="24" fill="#20334f"><tspan x="556" dy="0">A900 never requested</tspan><tspan x="556" dy="34">Duplicate A300 still has a</tspan><tspan x="556" dy="34">match</tspan></text><text x="40" y="445" font-family="Arial, sans-serif" font-size="13" fill="#536780"><tspan x="40" dy="0">COLUMN HARBOR  /  WORKED EXAMPLE</tspan></text></svg>