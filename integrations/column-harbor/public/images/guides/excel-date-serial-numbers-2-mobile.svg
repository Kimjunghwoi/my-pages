<svg xmlns="http://www.w3.org/2000/svg" width="480" height="706" viewBox="0 0 480 706" role="img" aria-labelledby="title desc"><title id="title">One day is the denominator</title><desc id="desc">One quarter, one half and three quarters of a day display as 6 AM, noon and 6 PM respectively.</desc><rect width="480" height="706" rx="14" fill="#f4f7fb"/><text x="26" y="48" font-family="Arial, sans-serif" font-size="27" fill="#142645"><tspan x="26" dy="0">One day is the denominator</tspan></text><rect x="26" y="120" width="428" height="250" rx="10" fill="#ffffff" stroke="#d5dfec"/><rect x="26" y="120" width="428" height="5" rx="2" fill="#60708b"/><text x="48" y="156" font-family="Arial, sans-serif" font-size="14" fill="#60708b"><tspan x="48" dy="0">FIRST CASE</tspan></text><text x="48" y="194" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="48" dy="0">Fraction of one day</tspan></text><text x="48" y="259" font-family="Consolas, monospace" font-size="23" fill="#20334f"><tspan x="48" dy="0">0.25 = 6 / 24</tspan><tspan x="48" dy="34">0.50 = 12 / 24</tspan><tspan x="48" dy="34">0.75 = 18 / 24</tspan></text><rect x="26" y="392" width="428" height="250" rx="10" fill="#eef3ff" stroke="#d5dfec"/><rect x="26" y="392" width="428" height="5" rx="2" fill="#234ddd"/><text x="48" y="428" font-family="Arial, sans-serif" font-size="14" fill="#234ddd"><tspan x="48" dy="0">SECOND CASE</tspan></text><text x="48" y="466" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="48" dy="0">Clock display</tspan></text><text x="48" y="531" font-family="Consolas, monospace" font-size="23" fill="#20334f"><tspan x="48" dy="0">06:00:00</tspan><tspan x="48" dy="34">12:00:00</tspan><tspan x="48" dy="34">18:00:00</tspan></text><text x="26" y="684" font-family="Arial, sans-serif" font-size="13" fill="#536780"><tspan x="26" dy="0">COLUMN HARBOR  /  WORKED EXAMPLE</tspan></text></svg>