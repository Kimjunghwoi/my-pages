<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="472" viewBox="0 0 1040 472" role="img" aria-labelledby="title desc"><title id="title">A matching total can hide different inputs</title><desc id="desc">Expected sources: January: 2; February: 1; Total: 3. Wrong selection: January: 0; February: 1; Old backup: 2; Total: 3. Illustrative comparison: the same total does not prove that the correct files were included.</desc><rect width="1040" height="472" rx="14" fill="#f4f7fb"/><text x="40" y="48" font-family="Arial, sans-serif" font-size="32" fill="#142645"><tspan x="40" dy="0">A matching total can hide different inputs</tspan></text><rect x="40" y="127" width="466" height="281" rx="10" fill="#ffffff" stroke="#d5dfec"/><rect x="40" y="127" width="466" height="5" rx="2" fill="#60708b"/><text x="62" y="163" font-family="Arial, sans-serif" font-size="14" fill="#60708b"><tspan x="62" dy="0">FIRST CASE</tspan></text><text x="62" y="201" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="62" dy="0">Expected sources</tspan></text><text x="62" y="266" font-family="Consolas, monospace" font-size="24" fill="#20334f"><tspan x="62" dy="0">January: 2</tspan><tspan x="62" dy="34">February: 1</tspan><tspan x="62" dy="34">Total: 3</tspan></text><rect x="534" y="127" width="466" height="281" rx="10" fill="#eef3ff" stroke="#d5dfec"/><rect x="534" y="127" width="466" height="5" rx="2" fill="#234ddd"/><text x="556" y="163" font-family="Arial, sans-serif" font-size="14" fill="#234ddd"><tspan x="556" dy="0">SECOND CASE</tspan></text><text x="556" y="201" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="556" dy="0">Wrong selection</tspan></text><text x="556" y="266" font-family="Consolas, monospace" font-size="24" fill="#20334f"><tspan x="556" dy="0">January: 0</tspan><tspan x="556" dy="34">February: 1</tspan><tspan x="556" dy="34">Old backup: 2</tspan><tspan x="556" dy="34">Total: 3</tspan></text><text x="40" y="450" font-family="Arial, sans-serif" font-size="13" fill="#536780"><tspan x="40" dy="0">COLUMN HARBOR  /  WORKED EXAMPLE</tspan></text></svg>