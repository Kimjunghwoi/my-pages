<svg xmlns="http://www.w3.org/2000/svg" width="480" height="741" viewBox="0 0 480 741" role="img" aria-labelledby="title desc"><title id="title">The answer needs a rectangle</title><desc id="desc">A note in G3 overlaps the middle row of the required F2 through H4 filter result.</desc><rect width="480" height="741" rx="14" fill="#f4f7fb"/><text x="26" y="48" font-family="Arial, sans-serif" font-size="27" fill="#142645"><tspan x="26" dy="0">The answer needs a</tspan><tspan x="26" dy="35">rectangle</tspan></text><rect x="26" y="155" width="428" height="250" rx="10" fill="#ffffff" stroke="#d5dfec"/><rect x="26" y="155" width="428" height="5" rx="2" fill="#60708b"/><text x="48" y="191" font-family="Arial, sans-serif" font-size="14" fill="#60708b"><tspan x="48" dy="0">FIRST CASE</tspan></text><text x="48" y="229" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="48" dy="0">Required output</tspan></text><text x="48" y="294" font-family="Consolas, monospace" font-size="23" fill="#20334f"><tspan x="48" dy="0">F2:H2: T-01</tspan><tspan x="48" dy="34">F3:H3: T-03</tspan><tspan x="48" dy="34">F4:H4: T-05</tspan></text><rect x="26" y="427" width="428" height="250" rx="10" fill="#eef3ff" stroke="#d5dfec"/><rect x="26" y="427" width="428" height="5" rx="2" fill="#234ddd"/><text x="48" y="463" font-family="Arial, sans-serif" font-size="14" fill="#234ddd"><tspan x="48" dy="0">SECOND CASE</tspan></text><text x="48" y="501" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="48" dy="0">Example blocker</tspan></text><text x="48" y="566" font-family="Consolas, monospace" font-size="23" fill="#20334f"><tspan x="48" dy="0">G3 contains a note</tspan><tspan x="48" dy="34">Move the note elsewhere</tspan><tspan x="48" dy="34">Keep F2:H4 available</tspan></text><text x="26" y="719" font-family="Arial, sans-serif" font-size="13" fill="#536780"><tspan x="26" dy="0">COLUMN HARBOR  /  WORKED EXAMPLE</tspan></text></svg>