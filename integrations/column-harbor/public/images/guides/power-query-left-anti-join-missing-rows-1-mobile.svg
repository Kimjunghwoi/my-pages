<svg xmlns="http://www.w3.org/2000/svg" width="480" height="861" viewBox="0 0 480 861" role="img" aria-labelledby="title desc"><title id="title">Direction changes the question</title><desc id="desc">Illustrative exact-key comparison: left anti preserves unmatched left records; reversing the inputs answers a different question.</desc><rect width="480" height="861" rx="14" fill="#f4f7fb"/><text x="26" y="48" font-family="Arial, sans-serif" font-size="27" fill="#142645"><tspan x="26" dy="0">Direction changes the</tspan><tspan x="26" dy="35">question</tspan></text><rect x="26" y="155" width="428" height="310" rx="10" fill="#ffffff" stroke="#d5dfec"/><rect x="26" y="155" width="428" height="5" rx="2" fill="#60708b"/><text x="48" y="191" font-family="Arial, sans-serif" font-size="14" fill="#60708b"><tspan x="48" dy="0">FIRST CASE</tspan></text><text x="48" y="229" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="48" dy="0">Requests compared to</tspan><tspan x="48" dy="29">availability</tspan></text><text x="48" y="323" font-family="Consolas, monospace" font-size="23" fill="#20334f"><tspan x="48" dy="0">A200 lines L2 and L3</tspan><tspan x="48" dy="34">missing</tspan><tspan x="48" dy="34">Leading-space A100 line L6</tspan><tspan x="48" dy="34">missing</tspan></text><rect x="26" y="487" width="428" height="310" rx="10" fill="#eef3ff" stroke="#d5dfec"/><rect x="26" y="487" width="428" height="5" rx="2" fill="#234ddd"/><text x="48" y="523" font-family="Arial, sans-serif" font-size="14" fill="#234ddd"><tspan x="48" dy="0">SECOND CASE</tspan></text><text x="48" y="561" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="48" dy="0">Availability compared to</tspan><tspan x="48" dy="29">requests</tspan></text><text x="48" y="655" font-family="Consolas, monospace" font-size="23" fill="#20334f"><tspan x="48" dy="0">A900 never requested</tspan><tspan x="48" dy="34">Duplicate A300 still has a</tspan><tspan x="48" dy="34">match</tspan></text><text x="26" y="839" font-family="Arial, sans-serif" font-size="13" fill="#536780"><tspan x="26" dy="0">COLUMN HARBOR  /  WORKED EXAMPLE</tspan></text></svg>