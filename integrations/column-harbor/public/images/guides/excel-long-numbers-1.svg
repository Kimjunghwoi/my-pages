<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="506" viewBox="0 0 1040 506" role="img" aria-labelledby="title desc"><title id="title">Display change or changed identifier?</title><desc id="desc">A 15-digit value remains intact behind scientific notation, while a changed 16-digit identifier does not match its source after formatting.</desc><rect width="1040" height="506" rx="14" fill="#f4f7fb"/><text x="40" y="48" font-family="Arial, sans-serif" font-size="32" fill="#142645"><tspan x="40" dy="0">Display change or changed identifier?</tspan></text><rect x="40" y="127" width="466" height="315" rx="10" fill="#ffffff" stroke="#d5dfec"/><rect x="40" y="127" width="466" height="5" rx="2" fill="#60708b"/><text x="62" y="163" font-family="Arial, sans-serif" font-size="14" fill="#60708b"><tspan x="62" dy="0">FIRST CASE</tspan></text><text x="62" y="201" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="62" dy="0">Display-only control</tspan></text><text x="62" y="266" font-family="Consolas, monospace" font-size="24" fill="#20334f"><tspan x="62" dy="0">Source: 123456789012345</tspan><tspan x="62" dy="34">Visible: 1.23E+14</tspan><tspan x="62" dy="34">Number format:</tspan><tspan x="62" dy="34">123456789012345</tspan><tspan x="62" dy="34">Original still matches</tspan></text><rect x="534" y="127" width="466" height="315" rx="10" fill="#eef3ff" stroke="#d5dfec"/><rect x="534" y="127" width="466" height="5" rx="2" fill="#234ddd"/><text x="556" y="163" font-family="Arial, sans-serif" font-size="14" fill="#234ddd"><tspan x="556" dy="0">SECOND CASE</tspan></text><text x="556" y="201" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="556" dy="0">Already changed value</tspan></text><text x="556" y="266" font-family="Consolas, monospace" font-size="24" fill="#20334f"><tspan x="556" dy="0">Source: 1234567890123456</tspan><tspan x="556" dy="34">Stored: 1234567890123450</tspan><tspan x="556" dy="34">TEXT result: 123456789012345</tspan><tspan x="556" dy="34">0</tspan><tspan x="556" dy="34">Original does not match</tspan></text><text x="40" y="484" font-family="Arial, sans-serif" font-size="13" fill="#536780"><tspan x="40" dy="0">COLUMN HARBOR  /  WORKED EXAMPLE</tspan></text></svg>