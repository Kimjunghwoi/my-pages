<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="441" viewBox="0 0 1040 441" role="img" aria-labelledby="title desc"><title id="title">Make input selection visible</title><desc id="desc">Input folder: january.csv: 2 orders; february.csv: 1 order. Expected combination: Selected files: 2; Data records: 3; Quantity total: 6. Synthetic totals provide a small reconciliation target before the first load.</desc><rect width="1040" height="441" rx="14" fill="#f4f7fb"/><text x="40" y="48" font-family="Arial, sans-serif" font-size="32" fill="#142645"><tspan x="40" dy="0">Make input selection visible</tspan></text><rect x="40" y="127" width="466" height="250" rx="10" fill="#ffffff" stroke="#d5dfec"/><rect x="40" y="127" width="466" height="5" rx="2" fill="#60708b"/><text x="62" y="163" font-family="Arial, sans-serif" font-size="14" fill="#60708b"><tspan x="62" dy="0">FIRST CASE</tspan></text><text x="62" y="201" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="62" dy="0">Input folder</tspan></text><text x="62" y="266" font-family="Consolas, monospace" font-size="24" fill="#20334f"><tspan x="62" dy="0">january.csv: 2 orders</tspan><tspan x="62" dy="34">february.csv: 1 order</tspan></text><rect x="534" y="127" width="466" height="250" rx="10" fill="#eef3ff" stroke="#d5dfec"/><rect x="534" y="127" width="466" height="5" rx="2" fill="#234ddd"/><text x="556" y="163" font-family="Arial, sans-serif" font-size="14" fill="#234ddd"><tspan x="556" dy="0">SECOND CASE</tspan></text><text x="556" y="201" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="556" dy="0">Expected combination</tspan></text><text x="556" y="266" font-family="Consolas, monospace" font-size="24" fill="#20334f"><tspan x="556" dy="0">Selected files: 2</tspan><tspan x="556" dy="34">Data records: 3</tspan><tspan x="556" dy="34">Quantity total: 6</tspan></text><text x="40" y="419" font-family="Arial, sans-serif" font-size="13" fill="#536780"><tspan x="40" dy="0">COLU