<svg xmlns="http://www.w3.org/2000/svg" width="480" height="741" viewBox="0 0 480 741" role="img" aria-labelledby="title desc"><title id="title">Fill follows order inside a batch</title><desc id="desc">The first missing label has no earlier value; only later missing labels can inherit North.</desc><rect width="480" height="741" rx="14" fill="#f4f7fb"/><text x="26" y="48" font-family="Arial, sans-serif" font-size="27" fill="#142645"><tspan x="26" dy="0">Fill follows order inside a</tspan><tspan x="26" dy="35">batch</tspan></text><rect x="26" y="155" width="428" height="250" rx="10" fill="#ffffff" stroke="#d5dfec"/><rect x="26" y="155" width="428" height="5" rx="2" fill="#60708b"/><text x="48" y="191" font-family="Arial, sans-serif" font-size="14" fill="#60708b"><tspan x="48" dy="0">FIRST CASE</tspan></text><text x="48" y="229" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="48" dy="0">Batch B1</tspan></text><text x="48" y="294" font-family="Consolas, monospace" font-size="23" fill="#20334f"><tspan x="48" dy="0">Row 1: missing</tspan><tspan x="48" dy="34">Row 2: North</tspan><tspan x="48" dy="34">Row 3: missing</tspan></text><rect x="26" y="427" width="428" height="250" rx="10" fill="#eef3ff" stroke="#d5dfec"/><rect x="26" y="427" width="428" height="5" rx="2" fill="#234ddd"/><text x="48" y="463" font-family="Arial, sans-serif" font-size="14" fill="#234ddd"><tspan x="48" dy="0">SECOND CASE</tspan></text><text x="48" y="501" font-family="Arial, sans-serif" font-size="21" fill="#142645"><tspan x="48" dy="0">After grouped fill</tspan></text><text x="48" y="566" font-family="Consolas, monospace" font-size="23" fill="#20334f"><tspan x="48" dy="0">Row 1: still missing</tspan><tspan x="48" dy="34">Row 2: North</tspan><tspan x="48" dy="34">Row 3: North</tspan></text><text x="26" y="719" font-family="Arial, sans-serif" font-size="13" fill="#536780"><tspan x="26" dy="0">COLUMN HARBOR  /  WORKED EXAMPLE</tspan></text></svg>