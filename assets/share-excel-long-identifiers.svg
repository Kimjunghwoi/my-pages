<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#f6f7f2"/><path d="M0 0H1200V13H0z" fill="#213f32"/><g font-family="Noto Sans KR, Malgun Gothic, sans-serif" fill="#213f32"><text x="60" y="78" font-size="19" font-weight="700" letter-spacing="2">JH SOFT LABS / 회몬</text><text x="60" y="150" font-size="18" fill="#5d754b">Excel · 긴 숫자 ID</text><text x="56" y="250" font-size="49" font-weight="700" letter-spacing="-2">16글자인데,</text><text x="56" y="326" font-size="49" font-weight="700" letter-spacing="-2">같은 ID가 아니었습니다.</text><text x="60" y="414" font-size="22" fill="#536258">LEN이 같아도 EXACT는 FALSE일 수 있습니다.</text><text x="60" y="452" font-size="22" fill="#536258">표시와 값 손상을 나누고 원본부터 보존하세요.</text><rect x="820" y="145" width="320" height="375" rx="4" fill="#e6eddc"/><text x="848" y="205" font-size="14" fill="#52644b">숫자 → TEXT</text><text x="848" y="247" font-size="24" font-weight="700">1234567890123450</text><text x="848" y="299" font-size="14" fill="#52644b">처음부터 Text</text><text x="848" y="341" font-size="24" font-weight="700">1234567890123456</text><text x="848" y="393" font-size="14" fill="#52644b">EXACT</text><text x="848" y="435" font-size="29" font-weight="700">FALSE</text><path d="M60 548H1140" stroke="#bfccb3"/><text x="60" y="592" font-size="17" fill="#536258">설명용 예제 · 조건과 확인 범위는 본문에서</text><text x="1140" y="592" text-anchor="end" font-size="18" font-weight="700">jhsoftlabs.com</text></g></svg>
