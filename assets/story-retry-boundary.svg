<svg xmlns="http://www.w3.org/2000/svg" width="640" height="860" viewBox="0 0 640 860" role="img" aria-labelledby="title desc">
  <title id="title">확정 전 실패와 확정 후 응답 유실의 재시도 경로</title>
  <desc id="desc">시작은 결과 0건, 남은 횟수 1회입니다. 확정 전에 실패하면 이 상태를 유지하고 재시도에서 처음 확정합니다. 확정 뒤 응답만 유실되면 결과 1건, 남은 횟수 0회가 이미 저장되어 같은 요청 키로 기존 결과를 반환합니다. 두 경로 모두 최종 결과는 1건, 남은 횟수는 0회입니다. 동시성이나 실제 데이터베이스를 나타내지 않는 학습 모델입니다.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#5c7257" stroke-width="1.5"/></marker></defs>
  <rect width="640" height="860" rx="12" fill="#f2f4eb"/>
  <g font-family="'Noto Sans KR','Malgun Gothic',sans-serif" fill="#24392f">
    <text x="32" y="49" font-size="18" letter-spacing="2">03 / WHERE DID IT FAIL?</text>
    <text x="32" y="96" font-size="30" font-weight="700">오류보다 먼저, 확정 여부 확인</text>
    <text x="32" y="138" font-size="24">시작: 결과 0건 · 남은 횟수 1회</text>
    <rect x="32" y="170" width="576" height="258" rx="8" fill="#fcf3e8" stroke="#d8b797"/>
    <text x="54" y="213" font-size="28" font-weight="700">A. 확정 전에 실패</text>
    <text x="54" y="255" font-size="25">아직 결과 0건 · 횟수 1회 유지</text>
    <path d="M70 277 V306" fill="none" stroke="#5c7257" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="99" y="304" font-size="23">같은 요청 키로 재시도</text>
    <rect x="54" y="328" width="532" height="70" rx="6" fill="#fff"/>
    <text x="73" y="372" font-size="25" font-weight="700">처음 확정: 결과 1건 · 남은 횟수 0</text>
    <rect x="32" y="452" width="576" height="258" rx="8" fill="#e4eddf" stroke="#b7c6ae"/>
    <text x="54" y="495" font-size="28" font-weight="700">B. 확정 후 응답만 유실</text>
    <text x="54" y="537" font-size="25">이미 결과 1건 · 남은 횟수 0</text>
    <path d="M70 559 V588" fill="none" stroke="#5c7257" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="99" y="586" font-size="23">같은 요청 키로 재시도</text>
    <rect x="54" y="610" width="532" height="70" rx="6" fill="#fff"/>
    <text x="73" y="654" font-size="25" font-weight="700">기존 결과 반환: 추가 차감 없음</text>
    <text x="32" y="760" font-size="27" font-weight="700">오류를 받음 ≠ 서버가 저장하지 않음</text>
    <text x="32" y="804" font-size="21">같은 키라도 입력이 달라지면 재시도가 아닙니다.</text>
    <text x="32" y="838" font-size="18" fill="#5d6d59">설명용 학습 모델 · 운영 화면·실제 DB 동시성 검증 아님</text>
  </g>
</svg>
